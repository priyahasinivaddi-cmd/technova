<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f2f5">
<title>Clear — Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f1f2f5;color:#202634;font-family:Manrope,sans-serif;display:grid;place-items:center;padding:24px}.calculator{width:min(100%,390px);padding:27px;background:#fff;border-radius:27px;box-shadow:0 20px 60px #25334b18}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.heading strong{font-size:14px;letter-spacing:.2px}.heading span{font-size:11px;color:#989eaa;letter-spacing:1px;text-transform:uppercase}.display{min-height:130px;border-radius:18px;background:#f5f6f8;padding:17px 18px 13px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;margin-bottom:18px}.expression{width:100%;min-height:23px;text-align:right;color:#969ba6;font:15px 'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{max-width:100%;font:500 clamp(34px,12vw,48px)/1.2 'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.display-actions{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:8px}.copy,.history-clear{border:0;background:transparent;color:#68738a;font:600 11px Manrope;cursor:pointer;padding:5px 0}.copy:hover,.history-clear:hover{color:#4155a5}.copy-status{font:11px 'DM Mono',monospace;color:#5266b6;min-height:14px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:61px;border:0;border-radius:15px;background:#f2f3f6;color:#2c3443;font:500 18px 'DM Mono',monospace;cursor:pointer;transition:transform .12s,background .15s;touch-action:manipulation}.key:hover{background:#e7eaf0}.key:active{transform:scale(.94)}.key:focus-visible,.copy:focus-visible,.history-clear:focus-visible,.history-item:focus-visible{outline:3px solid #a6b8ff;outline-offset:2px}.key.utility{color:#6b7485;background:#e9ecf2}.key.operator{color:#5266b6;background:#edf0ff;font-size:22px}.key.equals{grid-row:span 2;background:#5266b6;color:white;font-size:23px}.key.equals:hover{background:#4155a5}.key.zero{grid-column:span 2}.hint{text-align:center;color:#a2a7b0;font:11px 'DM Mono',monospace;margin:17px 0 0}.hint kbd{font:inherit;background:#f2f3f6;padding:3px 6px;border-radius:4px}.history{border-top:1px solid #eef0f3;margin-top:22px;padding-top:15px}.history-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.history-heading h2{font:700 12px Manrope;color:#747d8d;margin:0}.history-list{display:grid;gap:5px}.history-item{width:100%;display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border:0;border-radius:9px;background:#f7f8fa;color:#555f70;text-align:left;font:12px 'DM Mono',monospace;cursor:pointer}.history-item:hover{background:#edf0ff}.history-item strong{color:#303a4d}.history-empty{color:#a2a7b0;font:11px 'DM Mono',monospace;margin:0;padding:6px 0}@media(max-width:380px){body{padding:14px}.calculator{padding:20px;border-radius:23px}.key{height:58px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<main class="calculator" aria-label="Calculator">
<header class="heading"><strong>Clear</strong><span>Calculator</span></header>
<section class="display" aria-live="polite" aria-atomic="true"><div class="expression" id="expression"></div><div class="value" id="display">0</div><div class="display-actions"><span class="copy-status" id="copy-status" role="status"></span><button class="copy" id="copy-result" type="button">Copy result</button></div></section>
<section class="keys" aria-label="Calculator buttons"><button class="key utility" data-action="clear" aria-label="Clear">AC</button><button class="key utility" data-action="sign" aria-label="Change sign">+/−</button><button class="key utility" data-action="percent" aria-label="Percent">%</button><button class="key operator" data-op="÷" aria-label="Divide">÷</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×" aria-label="Multiply">×</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−" aria-label="Subtract">−</button><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+" aria-label="Add">+</button><button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals" aria-label="Equals">=</button></section>
<p class="hint">Keyboard supported · <kbd>Esc</kbd> clears · <kbd>Enter</kbd> equals</p>
<section class="history" aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">Recent calculations</h2><button class="history-clear" id="clear-history" type="button">Clear history</button></div><div class="history-list" id="history-list"></div></section>
</main>
<script>
const display=document.querySelector('#display'),expression=document.querySelector('#expression'),historyList=document.querySelector('#history-list');let current='0',stored=null,operator=null,replace=false,history=[];
function paint(){display.textContent=current;expression.textContent=stored!==null&&operator?`${stored} ${operator}`:''}
function format(n){if(!Number.isFinite(n))return 'Error';return String(Number.parseFloat(n.toPrecision(11)))}
function renderHistory(){historyList.replaceChildren();if(!history.length){const empty=document.createElement('p');empty.className='history-empty';empty.textContent='Your calculations will appear here.';historyList.append(empty);return}history.forEach(item=>{const button=document.createElement('button');button.className='history-item';button.type='button';button.setAttribute('aria-label',`Use result ${item.result}`);const eq=document.createElement('span');eq.textContent=item.expression;const result=document.createElement('strong');result.textContent=item.result;button.append(eq,result);button.addEventListener('click',()=>{current=item.result;stored=null;operator=null;replace=true;paint();expression.textContent=item.expression});historyList.append(button)})}
function digit(d){if(current==='Error'||replace){current=d;replace=false}else if(current==='0')current=d;else if(current.replace('-','').replace('.','').length<13)current+=d;paint()}
function calculate(a,b,op){switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b;default:return b}}
function choose(op){if(current==='Error')return;if(operator&&stored!==null&&!replace){current=format(calculate(stored,Number(current),operator));stored=Number(current)}else stored=Number(current);operator=op;replace=true;paint()}
function equals(){if(operator===null||stored===null||current==='Error')return;const a=stored,b=Number(current),op=operator,result=format(calculate(a,b,op)),line=`${format(a)} ${op} ${format(b)} = ${result}`;expression.textContent=`${format(a)} ${op} ${format(b)} =`;current=result;stored=null;operator=null;replace=true;if(result!=='Error'){history.unshift({expression:line,result});history=history.slice(0,6);renderHistory()}display.textContent=current}
function act(name){switch(name){case 'clear':current='0';stored=null;operator=null;replace=false;break;case 'decimal':if(current==='Error'||replace){current='0.';replace=false}else if(!current.includes('.'))current+='.';break;case 'sign':if(current!=='0'&&current!=='Error')current=current.startsWith('-')?current.slice(1):'-'+current;break;case 'percent':if(current!=='Error')current=format(Number(current)/100);break;case 'equals':equals();return}paint()}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else act(b.dataset.action)});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){digit(e.key);return}if(e.key==='.'||e.key===','){act('decimal');return}if(e.key==='Escape'){act('clear');return}if(e.key==='Backspace'){if(current==='Error'||replace)return;current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1);paint();return}if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();return}const ops={'+':'+','-':'−','*':'×','x':'×','/':'÷'};if(ops[e.key]){e.preventDefault();choose(ops[e.key])}});
document.querySelector('#copy-result').addEventListener('click',async()=>{const status=document.querySelector('#copy-status');try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(current)}else{const field=document.createElement('textarea');field.value=current;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied)throw new Error('Copy failed')}status.textContent='Copied'}catch{status.textContent='Copy unavailable'}setTimeout(()=>{status.textContent=''},1800)});
document.querySelector('#clear-history').addEventListener('click',()=>{history=[];renderHistory()});renderHistory();paint();
</script>
</body>
</html>
