<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f4">
<title>Little List — To-do, gently</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#29312b;--muted:#8a918b;--green:#487258;--paper:#f5f6f4;--line:#e9ece8;--mint:#edf3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink);padding:56px 20px}.app{width:min(100%,650px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font:700 20px Manrope;letter-spacing:-.7px;text-decoration:none;color:inherit}.brand span{color:var(--green)}.date{font-size:12px;color:var(--muted)}.greeting{font:600 34px Manrope;letter-spacing:-1.5px;margin:0 0 7px}.subtitle{font-size:14px;color:var(--muted);margin:0 0 26px}.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;background:white;border:1px solid var(--line);padding:8px;border-radius:15px;box-shadow:0 5px 16px #25332508}.composer input[type=text]{grid-column:1/-1;min-width:0;border:0;outline:0;background:transparent;padding:10px 12px;font:14px 'DM Sans',sans-serif;color:var(--ink)}.composer input::placeholder{color:#a6aca7}.composer-options{display:flex;gap:9px;align-items:end}.field{display:grid;gap:4px;color:#858c86;font-size:10px;font-weight:700;letter-spacing:.4px}.field input,.field select{min-height:36px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:6px 9px;font:12px 'DM Sans',sans-serif}.composer button,.save-edit{border:0;border-radius:10px;background:var(--green);color:white;font:600 13px 'DM Sans',sans-serif;padding:0 19px;cursor:pointer;transition:background .2s,transform .15s}.composer button:hover,.save-edit:hover{background:#385c46}.composer button:active{transform:scale(.97)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:27px 2px 7px}.filters{display:flex;gap:5px}.filter{border:0;background:transparent;color:#858c86;font:600 12px 'DM Sans',sans-serif;padding:8px 11px;border-radius:9px;cursor:pointer}.filter.active{background:#e7eee8;color:var(--green)}.count{color:var(--muted);font-size:11px}.list{display:grid;gap:8px}.todo{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;animation:arrive .2s ease both}.todo.dragging{opacity:.45}.todo.drag-target{border-color:var(--green);box-shadow:0 0 0 2px #48725822}.todo.done .todo-text{text-decoration:line-through;color:#9ca39d}.check{width:19px;height:19px;flex:0 0 19px;border:1.5px solid #c9d1ca;border-radius:50%;background:#fff;color:white;display:grid;place-items:center;padding:0;cursor:pointer;font-size:12px;transition:all .15s}.done .check{background:var(--green);border-color:var(--green)}.todo-main{flex:1;min-width:0}.todo-text{display:block;overflow-wrap:anywhere;font-size:14px;line-height:1.4}.todo-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:3px 8px;background:#f2f4f2;color:#798079;font-size:10px}.badge.priority-high{background:#f9e9e6;color:#a44e41}.badge.priority-normal{background:#edf1fa;color:#586a99}.badge.priority-low{background:#eef4e9;color:#66804f}.badge.overdue{background:#fae9e7;color:#a44e41;font-weight:700}.actions{display:flex;align-items:center;gap:2px}.icon-button{border:0;background:transparent;color:#8a918b;font:500 16px 'DM Sans',sans-serif;line-height:1;cursor:pointer;padding:7px 6px;border-radius:7px}.icon-button:hover{background:#f1f4f1;color:var(--green)}.icon-button:disabled{opacity:.35;cursor:not-allowed;background:transparent}.reorder{cursor:grab;color:#a3aaa4}.reorder:active{cursor:grabbing}.delete:hover{color:#bb655a}.empty{display:none;text-align:center;padding:44px 20px;background:#fff;border:1px dashed #dfe5df;border-radius:13px;color:var(--muted);font-size:13px}.empty-mark{font-size:25px;margin-bottom:8px;color:#91a994}.foot{margin-top:20px;text-align:center;color:#a0a69f;font-size:11px}.clear-done{border:0;background:transparent;color:#858c86;font:500 11px 'DM Sans',sans-serif;cursor:pointer}.clear-done:hover{color:var(--green)}.reorder-note{min-height:14px;margin:0 2px 13px;color:#a0a69f;font-size:10px;text-align:right}dialog{width:min(420px,calc(100% - 30px));border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink);box-shadow:0 20px 65px #1d2a1d30}dialog::backdrop{background:#1d2a1d66}dialog h2{font:600 20px Manrope;letter-spacing:-.5px;margin:0 0 18px}.edit-fields{display:grid;gap:13px}.edit-fields input,.edit-fields select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:13px 'DM Sans',sans-serif}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.cancel-edit,.save-edit{min-height:38px;padding:0 15px;border-radius:9px;font:600 12px 'DM Sans',sans-serif;cursor:pointer}.cancel-edit{border:1px solid var(--line);background:white;color:var(--ink)}.save-edit{border:0}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){body{padding:30px 15px}.greeting{font-size:30px}.toolbar{margin-top:21px}.composer{grid-template-columns:1fr}.composer input[type=text]{grid-column:1}.composer-options{grid-column:1}.composer button{grid-column:1;min-height:42px}.todo{gap:8px;padding:11px}.actions{gap:0}.icon-button{padding:7px 5px}.reorder-note{text-align:left}}@media(max-width:390px){.todo{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end;max-width:105px}.todo-meta{gap:5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><a href="#" class="brand">little<span>list</span>.</a><time class="date" id="date"></time></header>
<h1 class="greeting">A little progress adds up.</h1><p class="subtitle">Make space for what matters today.</p>
<form class="composer" id="form"><input id="new-task" type="text" maxlength="140" placeholder="What’s on your mind?" autocomplete="off" aria-label="New task"><div class="composer-options"><label class="field">Due date<input id="new-due" type="date"></label><label class="field">Priority<select id="new-priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label></div><button type="submit">Add task <span aria-hidden="true">＋</span></button></form>
<div class="toolbar"><div class="filters" role="group" aria-label="Filter tasks"><button class="filter active" data-filter="all" type="button">All</button><button class="filter" data-filter="active" type="button">To do</button><button class="filter" data-filter="done" type="button">Done</button></div><div><span class="count" id="count"></span> <button class="clear-done" id="clear-done" type="button">Clear done</button></div></div>
<p class="reorder-note" id="reorder-note">Drag tasks or use the arrows to change their order.</p><section class="list" id="list" aria-label="Your tasks"></section><div class="empty" id="empty"><div class="empty-mark">✳</div><span id="empty-text">Nothing on your list yet.</span></div><footer class="foot">Your list stays saved on this device.</footer>
</main>
<dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form"><h2 id="edit-title">Edit task</h2><div class="edit-fields"><label class="field">Task<input id="edit-text" type="text" maxlength="140" required></label><label class="field">Due date<input id="edit-due" type="date"></label><label class="field">Priority<select id="edit-priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label></div><div class="dialog-actions"><button class="cancel-edit" id="cancel-edit" type="button">Cancel</button><button class="save-edit" type="submit">Save changes</button></div></form></dialog>
<script>
const KEY='little-list-tasks-v1',list=document.querySelector('#list'),input=document.querySelector('#new-task'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),emptyText=document.querySelector('#empty-text'),dialog=document.querySelector('#edit-dialog');let tasks=[],filter='all',editingId=null,draggingId=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean').map(t=>({...t,due:typeof t.due==='string'?t.due:'',priority:['high','normal','low'].includes(t.priority)?t.priority:'normal'}))}catch{tasks=[]}
document.querySelector('#date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{}}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateLabel(value){if(!value)return '';const [y,m,d]=value.split('-').map(Number);return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(y,m-1,d))}
function moveTask(fromId,toId){const from=tasks.findIndex(t=>t.id===fromId),to=tasks.findIndex(t=>t.id===toId);if(from<0||to<0||from===to)return;const [item]=tasks.splice(from,1);tasks.splice(to,0,item);save();render()}
function render(){list.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done));visible.forEach((task,index)=>{const row=document.createElement('article');row.className='todo'+(task.done?' done':'');row.dataset.id=task.id;row.draggable=filter==='all';
const check=document.createElement('button');check.className='check';check.type='button';check.setAttribute('aria-label',task.done?'Mark as to do':'Mark as done');check.setAttribute('aria-pressed',String(task.done));check.textContent=task.done?'✓':'';check.addEventListener('click',()=>{task.done=!task.done;save();render()});
const main=document.createElement('div');main.className='todo-main';const text=document.createElement('span');text.className='todo-text';text.textContent=task.text;main.append(text);const meta=document.createElement('div');meta.className='todo-meta';if(task.due){const due=document.createElement('span');due.className='badge'+(!task.done&&task.due<todayKey()?' overdue':'');due.textContent=`Due ${dateLabel(task.due)}${!task.done&&task.due<todayKey()?' · overdue':''}`;meta.append(due)}const priority=document.createElement('span');priority.className=`badge priority-${task.priority}`;priority.textContent=`${task.priority==='high'?'High':task.priority==='low'?'Low':'Normal'} priority`;meta.append(priority);main.append(meta);
const actions=document.createElement('div');actions.className='actions';const up=document.createElement('button');up.className='icon-button reorder';up.type='button';up.textContent='↑';up.setAttribute('aria-label',`Move ${task.text} up`);up.disabled=filter!=='all'||index===0;up.addEventListener('click',()=>{const i=tasks.findIndex(t=>t.id===task.id);if(i>0)moveTask(task.id,tasks[i-1].id)});const down=document.createElement('button');down.className='icon-button reorder';down.type='button';down.textContent='↓';down.setAttribute('aria-label',`Move ${task.text} down`);down.disabled=filter!=='all'||index===visible.length-1;down.addEventListener('click',()=>{const i=tasks.findIndex(t=>t.id===task.id);if(i>=0&&i<tasks.length-1)moveTask(task.id,tasks[i+1].id)});
const edit=document.createElement('button');edit.className='icon-button';edit.type='button';edit.textContent='✎';edit.setAttribute('aria-label',`Edit ${task.text}`);edit.addEventListener('click',()=>openEditor(task));const del=document.createElement('button');del.className='icon-button delete';del.type='button';del.setAttribute('aria-label',`Delete ${task.text}`);del.textContent='×';del.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()});actions.append(up,down,edit,del);row.append(check,main,actions);
row.addEventListener('dragstart',e=>{if(filter!=='all'){e.preventDefault();return}draggingId=task.id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',task.id)});row.addEventListener('dragend',()=>{draggingId=null;row.classList.remove('dragging');list.querySelectorAll('.drag-target').forEach(el=>el.classList.remove('drag-target'))});row.addEventListener('dragover',e=>{if(!draggingId||draggingId===task.id)return;e.preventDefault();row.classList.add('drag-target')});row.addEventListener('dragleave',()=>row.classList.remove('drag-target'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drag-target');const from=e.dataTransfer.getData('text/plain')||draggingId;if(from)moveTask(from,task.id)});list.append(row)});
const remaining=tasks.filter(t=>!t.done).length;count.textContent=`${remaining} ${remaining===1?'task':'tasks'} left`;empty.style.display=visible.length?'none':'block';emptyText.textContent=filter==='done'?'No completed tasks yet.':filter==='active'?'You’re all caught up.':'Nothing on your list yet.';document.querySelector('#clear-done').style.visibility=tasks.some(t=>t.done)?'visible':'hidden';document.querySelector('#reorder-note').textContent=filter==='all'?'Drag tasks or use the arrows to change their order.':'Switch to All to reorder tasks.'}
function openEditor(task){editingId=task.id;document.querySelector('#edit-text').value=task.text;document.querySelector('#edit-due').value=task.due||'';document.querySelector('#edit-priority').value=task.priority||'normal';dialog.showModal();document.querySelector('#edit-text').focus()}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){input.focus();return}tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,text,done:false,due:document.querySelector('#new-due').value,priority:document.querySelector('#new-priority').value});input.value='';document.querySelector('#new-due').value='';document.querySelector('#new-priority').value='normal';save();render();input.focus()});
document.querySelector('.filters').addEventListener('click',e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));render()});
document.querySelector('#clear-done').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()});document.querySelector('#edit-form').addEventListener('submit',e=>{e.preventDefault();const task=tasks.find(t=>t.id===editingId);if(task){task.text=document.querySelector('#edit-text').value.trim();task.due=document.querySelector('#edit-due').value;task.priority=document.querySelector('#edit-priority').value;save();render()}dialog.close()});document.querySelector('#cancel-edit').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();
</script>
</body>
</html>
