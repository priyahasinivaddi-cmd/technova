<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f2f5"><title>Clear — Calculator</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f1f2f5;color:#202634;font-family:Manrope,sans-serif;display:grid;place-items:center;padding:24px}.calculator{width:min(100%,362px);padding:27px;background:#fff;border-radius:27px;box-shadow:0 20px 60px #25334b18}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.heading strong{font-size:14px;letter-spacing:.2px}.heading span{font-size:11px;color:#989eaa;letter-spacing:1px;text-transform:uppercase}.display{min-height:120px;border-radius:18px;background:#f5f6f8;padding:20px 18px 16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;margin-bottom:18px}.expression{width:100%;min-height:23px;text-align:right;color:#969ba6;font:15px 'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{max-width:100%;font:500 clamp(34px,12vw,48px)/1.2 'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:61px;border:0;border-radius:15px;background:#f2f3f6;color:#2c3443;font:500 18px 'DM Mono',monospace;cursor:pointer;transition:transform .12s,background .15s;touch-action:manipulation}.key:hover{background:#e7eaf0}.key:active{transform:scale(.94)}.key:focus-visible{outline:3px solid #a6b8ff;outline-offset:2px}.key.utility{color:#6b7485;background:#e9ecf2}.key.operator{color:#5266b6;background:#edf0ff;font-size:22px}.key.equals{grid-row:span 2;background:#5266b6;color:white;font-size:23px}.key.equals:hover{background:#4155a5}.key.zero{grid-column:span 2}.hint{text-align:center;color:#a2a7b0;font:11px 'DM Mono',monospace;margin:18px 0 0}.hint kbd{font:inherit;background:#f2f3f6;padding:3px 6px;border-radius:4px}
@media(max-width:380px){body{padding:14px}.calculator{padding:20px;border-radius:23px}.key{height:58px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}</style></head><body><main class="calculator" aria-label="Calculator"><header class="heading"><strong>Clear</strong><span>Calculator</span></header><section class="display" aria-live="polite" aria-atomic="true"><div class="expression" id="expression"></div><div class="value" id="display">0</div></section><section class="keys" aria-label="Calculator buttons"><button class="key utility" data-action="clear" aria-label="Clear">AC</button><button class="key utility" data-action="sign" aria-label="Change sign">+/−</button><button class="key utility" data-action="percent" aria-label="Percent">%</button><button class="key operator" data-op="÷" aria-label="Divide">÷</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×" aria-label="Multiply">×</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−" aria-label="Subtract">−</button><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+" aria-label="Add">+</button><button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals" aria-label="Equals">=</button></section><p class="hint">Keyboard supported · <kbd>Esc</kbd> clears · <kbd>Enter</kbd> equals</p></main><script>
const display=document.querySelector('#display'),expression=document.querySelector('#expression');let current='0',stored=null,operator=null,replace=false,justEvaluated=false;function paint(){display.textContent=current;expression.textContent=stored!==null&&operator?`${stored} ${operator}`:''}function format(n){if(!Number.isFinite(n))return 'Error';return String(Number.parseFloat(n.toPrecision(11)))}function digit(d){if(current==='Error'||replace){current=d;replace=false}else if(current==='0')current=d;else if(current.replace('-','').replace('.','').length<13)current+=d;justEvaluated=false;paint()}function calculate(a,b,op){switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b;default:return b}}function choose(op){if(current==='Error')return;if(operator&&stored!==null&&!replace){current=format(calculate(stored,Number(current),operator));stored=Number(current)}else stored=Number(current);operator=op;replace=true;justEvaluated=false;paint()}function equals(){if(operator===null||stored===null||current==='Error')return;const a=stored,b=Number(current),result=calculate(a,b,operator);expression.textContent=`${format(a)} ${operator} ${format(b)} =`;current=format(result);stored=null;operator=null;replace=true;justEvaluated=true;display.textContent=current}function act(name){switch(name){case 'clear':current='0';stored=null;operator=null;replace=false;justEvaluated=false;break;case 'decimal':if(current==='Error'||replace){current='0.';replace=false}else if(!current.includes('.'))current+='.';justEvaluated=false;break;case 'sign':if(current!=='0'&&current!=='Error')current=current.startsWith('-')?current.slice(1):'-'+current;justEvaluated=false;break;case 'percent':if(current!=='Error')current=format(Number(current)/100);justEvaluated=false;break;case 'equals':equals();return}paint()}document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else act(b.dataset.action)});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key)){digit(e.key);return}if(e.key==='.'||e.key===','){act('decimal');return}if(e.key==='Escape'){act('clear');return}if(e.key==='Backspace'){if(current==='Error'||replace)return;current=current.length<=1||current.length===2&&current.startsWith('-')?'0':current.slice(0,-1);paint();return}if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();return}const ops={'+':'+','-':'−','*':'×','x':'×','/':'÷'};if(ops[e.key]){e.preventDefault();choose(ops[e.key])}});paint();</script></body></html>
