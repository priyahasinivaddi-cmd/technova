<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f4"><title>Little List — To-do, gently</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#29312b;--muted:#8a918b;--green:#487258;--paper:#f5f6f4;--line:#e9ece8;--mint:#edf3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink);padding:56px 20px}.app{width:min(100%,590px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font:700 20px Manrope;letter-spacing:-.7px}.brand span{color:var(--green)}.date{font-size:12px;color:var(--muted)}.greeting{font:600 34px Manrope;letter-spacing:-1.5px;margin:0 0 7px}.subtitle{font-size:14px;color:var(--muted);margin:0 0 26px}.composer{display:flex;gap:9px;background:white;border:1px solid var(--line);padding:8px;border-radius:15px;box-shadow:0 5px 16px #25332508}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 12px;font:14px 'DM Sans',sans-serif;color:var(--ink)}.composer input::placeholder{color:#a6aca7}.composer button{border:0;border-radius:10px;background:var(--green);color:white;font:600 13px 'DM Sans',sans-serif;padding:0 19px;cursor:pointer;transition:background .2s,transform .15s}.composer button:hover{background:#385c46}.composer button:active{transform:scale(.97)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:27px 2px 13px}.filters{display:flex;gap:5px}.filter{border:0;background:transparent;color:#858c86;font:600 12px 'DM Sans',sans-serif;padding:8px 11px;border-radius:9px;cursor:pointer}.filter.active{background:#e7eee8;color:var(--green)}.count{color:var(--muted);font-size:11px}.list{display:grid;gap:8px}.todo{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;animation:arrive .2s ease both}.todo.done .todo-text{text-decoration:line-through;color:#9ca39d}.check{width:19px;height:19px;flex:0 0 19px;border:1.5px solid #c9d1ca;border-radius:50%;background:#fff;color:white;display:grid;place-items:center;padding:0;cursor:pointer;font-size:12px;transition:all .15s}.done .check{background:var(--green);border-color:var(--green)}.todo-text{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:1.4}.delete{border:0;background:transparent;color:#abb1ac;font-size:20px;line-height:1;cursor:pointer;padding:4px 5px;opacity:0;transition:color .15s}.todo:hover .delete,.delete:focus-visible{opacity:1}.delete:hover{color:#bb655a}.empty{display:none;text-align:center;padding:44px 20px;background:#fff;border:1px dashed #dfe5df;border-radius:13px;color:var(--muted);font-size:13px}.empty-mark{font-size:25px;margin-bottom:8px;color:#91a994}.foot{margin-top:26px;text-align:center;color:#a0a69f;font-size:11px}.clear-done{border:0;background:transparent;color:#858c86;font:500 11px 'DM Sans',sans-serif;cursor:pointer}.clear-done:hover{color:var(--green)}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){body{padding:30px 15px}.greeting{font-size:30px}.toolbar{margin-top:21px}.delete{opacity:1}.filter{padding:8px 9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}</style></head>
<body><main class="app"><header class="top"><a href="#" class="brand">little<span>list</span>.</a><time class="date" id="date"></time></header><h1 class="greeting">A little progress adds up.</h1><p class="subtitle">Make space for what matters today.</p><form class="composer" id="form"><input id="new-task" type="text" maxlength="140" placeholder="What’s on your mind?" autocomplete="off" aria-label="New task"><button type="submit">Add task <span aria-hidden="true">＋</span></button></form><div class="toolbar"><div class="filters" role="group" aria-label="Filter tasks"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">To do</button><button class="filter" data-filter="done">Done</button></div><div><span class="count" id="count"></span> <button class="clear-done" id="clear-done">Clear done</button></div></div><section class="list" id="list" aria-label="Your tasks"></section><div class="empty" id="empty"><div class="empty-mark">✳</div><span id="empty-text">Nothing on your list yet.</span></div><footer class="foot">Your list stays saved on this device.</footer></main><script>
const KEY='little-list-tasks-v1',list=document.querySelector('#list'),input=document.querySelector('#new-task'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),emptyText=document.querySelector('#empty-text');let tasks=[];let filter='all';try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean')}catch{tasks=[]}document.querySelector('#date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{}}function render(){list.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='active'&&!t.done)||(filter==='done'&&t.done));visible.forEach(task=>{const row=document.createElement('article');row.className='todo'+(task.done?' done':'');const check=document.createElement('button');check.className='check';check.type='button';check.setAttribute('aria-label',task.done?'Mark as to do':'Mark as done');check.setAttribute('aria-pressed',String(task.done));check.textContent=task.done?'✓':'';check.addEventListener('click',()=>{task.done=!task.done;save();render()});const text=document.createElement('span');text.className='todo-text';text.textContent=task.text;const del=document.createElement('button');del.className='delete';del.type='button';del.setAttribute('aria-label',`Delete ${task.text}`);del.textContent='×';del.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()});row.append(check,text,del);list.append(row)});const remaining=tasks.filter(t=>!t.done).length;count.textContent=`${remaining} ${remaining===1?'left':'left'}`;empty.style.display=visible.length?'none':'block';emptyText.textContent=filter==='done'?'No completed tasks yet.':filter==='active'?'You’re all caught up.':'Nothing on your list yet.';document.querySelector('#clear-done').style.visibility=tasks.some(t=>t.done)?'visible':'hidden'}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){input.focus();return}tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,text,done:false});input.value='';save();render();input.focus()});document.querySelector('.filters').addEventListener('click',e=>{const btn=e.target.closest('[data-filter]');if(!btn)return;filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===btn));render()});document.querySelector('#clear-done').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()});render();</script></body></html>
